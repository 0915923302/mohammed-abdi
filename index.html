<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101827">
  <meta name="description" content="Mohammed Abdi — from Dire Dawa, Ethiopia. Technology, creativity, knowledge and personal growth.">
  <title>Mohammed Abdi | Personal Links</title>
  <style>
    :root { color-scheme: dark; --bg:#0b1220; --panel:#121e30; --gold:#e8bd65; --muted:#b9c4d4; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; padding:32px 16px; display:grid; place-items:center;
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif; color:#f7f8fb;
      background:radial-gradient(circle at 50% 0%, #263b57 0, #111d30 38%, var(--bg) 75%); }
    main { width:min(100%,480px); padding:30px 24px 24px; border:1px solid #34445b; border-radius:26px;
      background:linear-gradient(160deg,rgba(27,43,64,.97),rgba(13,22,36,.98)); box-shadow:0 24px 80px #0008; text-align:center; }
    .avatar { width:92px;height:92px;margin:0 auto 18px;border-radius:50%;display:grid;place-items:center;
      border:2px solid var(--gold);background:#263750;color:var(--gold);font-size:32px;font-weight:800;letter-spacing:1px; }
    h1 { margin:0;font-size:30px;letter-spacing:.2px; }
    .place { margin:8px 0 18px;color:var(--gold);font-weight:600; }
    .bio { margin:0 auto 22px;max-width:350px;line-height:1.65;color:var(--muted); }
    .links { display:grid;gap:12px; }
    .links a { display:block;padding:15px 18px;border:1px solid #43536a;border-radius:14px;
      background:#1b2a40;color:#fff;text-decoration:none;font-weight:700;transition:.18s ease; }
    .links a:hover { transform:translateY(-2px);border-color:var(--gold);background:#243750; }
    .quote { margin:24px 0 0;color:var(--gold);font-weight:750;letter-spacing:.4px; }
    footer { margin-top:18px;color:#8998ac;font-size:12px; }
  </style>
</head>
<body>
  <main>
    <div class="avatar" aria-hidden="true">MA</div>
    <h1>Mohammed Abdi</h1>
    <div class="place">🇪🇹 From Dire Dawa, Ethiopia</div>
    <p class="bio">Welcome to my personal page.<br>
      Passionate about technology, creativity, knowledge, and personal growth.</p>
    <nav class="links" aria-label="Social media links">
      <a href="https://www.facebook.com/libban.abdusamad" target="_blank" rel="noopener noreferrer">Facebook</a>
      <a href="https://www.tiktok.com/@mohammed.dagii" target="_blank" rel="noopener noreferrer">TikTok</a>
      <a href="https://youtube.com/@mohammedibnuabdi5028" target="_blank" rel="noopener noreferrer">YouTube</a>
      <a href="https://wa.me/251915923302" target="_blank" rel="noopener noreferrer">WhatsApp</a>
    </nav>
    <p class="quote">Dream Big. Work Hard. Stay Humble.</p>
    <footer>© <span id="year">2026</span> Mohammed Abdi</footer>
  </main>
</body>
</html>
